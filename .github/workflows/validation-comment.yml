name: Validation PR Comment

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  update-comment:
    name: Update validation PR comment
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      # Explicitly check out the default branch of THIS repository (never the PR
      # head). The privileged workflow only ever sources trusted script code from
      # here; contributor code from a fork PR head is never fetched or executed.
      - name: Check out trusted script from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/validation-comment.js
          sparse-checkout-cone-mode: false

      - name: Download validation result
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: validation-result
          path: validation-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update sticky validation comment
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('path');
            const fs = require('fs');
            const { run } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'validation-comment.js'));
            await run({ github, context, core, fs });
