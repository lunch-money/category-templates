name: Sync marketing site

# Regenerates the marketing site's Jekyll data files whenever the dataset
# changes on main, and opens a pull request there. Netlify builds a deploy
# preview for that pull request, so the library is reviewed before it ships.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/render-marketing-data.rb"
      - ".github/workflows/sync-marketing-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-marketing-site
  cancel-in-progress: false

env:
  TARGET_REPO: lunch-money/marketing-site
  TARGET_BRANCH: category-templates-data-sync

jobs:
  sync:
    name: Open data update PR
    runs-on: ubuntu-latest
    steps:
      # Until the token is configured there is nothing this job can do, and
      # failing every merge would train people to ignore a red X.
      - name: Check for marketing site token
        id: token
        env:
          MARKETING_SITE_TOKEN: ${{ secrets.MARKETING_SITE_TOKEN }}
        run: |
          if [ -z "${MARKETING_SITE_TOKEN}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Sync skipped"
              echo
              echo "\`MARKETING_SITE_TOKEN\` is not set, so the marketing site was not updated."
              echo "Add a repository secret with \`contents:write\` and \`pull-requests:write\`"
              echo "on \`${TARGET_REPO}\` to enable automatic sync."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out dataset
        if: steps.token.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          path: category-templates

      - uses: ruby/setup-ruby@v1
        if: steps.token.outputs.configured == 'true'
        with:
          ruby-version: "3.3"

      - name: Validate before syncing
        if: steps.token.outputs.configured == 'true'
        working-directory: category-templates
        run: ruby scripts/validate.rb

      - name: Check out marketing site
        if: steps.token.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.MARKETING_SITE_TOKEN }}
          path: marketing-site

      - name: Render data files
        if: steps.token.outputs.configured == 'true'
        working-directory: category-templates
        run: ruby scripts/render-marketing-data.rb "$GITHUB_WORKSPACE/marketing-site"

      - name: Open or update pull request
        if: steps.token.outputs.configured == 'true'
        working-directory: marketing-site
        env:
          GH_TOKEN: ${{ secrets.MARKETING_SITE_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if git diff --quiet -- _data; then
            echo "Marketing site data is already up to date; nothing to sync."
            exit 0
          fi

          git config user.name "lunch-money-bot"
          git config user.email "bot@lunchmoney.app"

          # Reuse one long-lived branch so rapid merges update a single PR
          # rather than piling up near-identical ones.
          git checkout -B "$TARGET_BRANCH"
          git add _data/category_templates.yml _data/category_template_tags.yml
          git commit -m "Update category templates from ${SOURCE_SHA:0:7}"
          git push --force origin "$TARGET_BRANCH"

          existing=$(gh pr list --head "$TARGET_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Updated existing pull request #$existing"
            exit 0
          fi

          gh pr create \
            --title "Update category templates" \
            --body "Regenerated from [\`${SOURCE_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${SOURCE_SHA}) in \`${{ github.repository }}\`.

          These files are generated by \`scripts/render-marketing-data.rb\`. Review the Netlify preview of \`/category-templates\`, then merge." \
            --base main \
            --head "$TARGET_BRANCH"
