# A complete, annotated example of a single template entry.
#
# This file is not part of the published dataset — it exists so you can copy a
# known-good starting point. Paste your filled-in version at the end of
# data/templates.yml.

# Stable, unique slug. Lowercase words separated by single hyphens.
# Pick it once: it is used in links to your setup.
- id: example-household-budget
  # Short, distinct name shown on the card.
  title: Example Household Budget
  # However you would like to be credited.
  author: Jane from Toronto
  # One short line for the card, up to 240 characters. Skip anything already shown
  # beside it: the title, the category count, and the tags.
  description: >-
    Fixed bills sit apart from day-to-day spending, so only a handful of categories
    need checking each week.
  # Optional, and shown in full when someone opens the setup. Say as much as you like
  # about why it is built this way.
  in_their_words: |-
    We started with a category per merchant and drowned in it. Splitting fixed from
    variable meant we only had to think about five numbers a week.
  # Optional. Audience tags only, all from data/tags.yml. Setup size (Simple,
  # Detailed, Comprehensive) is derived from the category count, so it is not listed here.
  tags:
    - Couple / household
  # Optional. Context that does not belong in the description.
  notes: We revisit the fixed categories once a year when bills change.
  # Your category list in Lunch Money's import format.
  #
  #   - one category per line
  #   - a leading "-" makes the line a subcategory of the closest line above it
  #     that has no dash
  #   - a line with no dashes beneath it is a standalone category
  #   - properties go in square brackets at the end of a line, and may be
  #     income, exclude_from_budget, or exclude_from_totals
  categories: |
    Income [income]
    - Paycheck [income]
    - Interest [income]
    Fixed Bills
    - Rent
    - Utilities
    - Internet
    - Insurance
    Variable Spending
    - Groceries
    - Restaurants
    - Transit
    - Fun
    Savings
    Transfers [exclude_from_budget, exclude_from_totals]
