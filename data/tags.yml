# Controlled vocabulary for template tags.
#
# Two kinds of tags exist:
#
#   * Audience tags are stored on each template in data/templates.yml. Every tag
#     used there must appear in the "audience" group below.
#   * Setup size is derived from the category count at render time, so it is
#     never stored per template and never self-reported. Its tiers are listed
#     here only so the site can render them as filters.
#
# Adding an audience tag is a deliberate change. A tag has to describe a
# genuinely different money situation and apply to at least three templates,
# otherwise it returns a near-empty filter and just adds noise to the bar.
# Detail that is true of only one or two setups belongs in their descriptions.

- id: audience
  label: Who it's for
  tags:
    - Solo / single
    - Couple / household
    - Family with kids
    - Salaried employee
    - Self-employed
    - Frequent traveler
    - Cross-border

- id: style
  label: Setup size
  derived: category_count
  tags:
    - label: Simple
      max: 39
    - label: Detailed
      min: 40
      max: 79
    - label: Comprehensive
      min: 80
