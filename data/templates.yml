    Moving money around [exclude_from_totals]
    Groceries
    Eating out
    Rent & utilities
    Donation
    Art
    Medical
    Books
    Phone
    Clothes
    Shopping
    Electronics & tech
    Cash back [income]
    Into savings [income]
    Car
    Education
    Entertainment
    Fees
    Games
    Gifts
    Gifts to me [income]
    Interest [income]
    Money exchange [exclude_from_budget]
    Museums & landmarks
