- id: community-category-setup
  title: Community category setup
  author: Community member
  description: >-
    Each group is a lever on your life, and the spending inside tells the story.
  in_their_words: |-
    Structured like a P&L would be. Each major Category represents a lever in the direction of your life, the detailed spend within tells the story. 
    If you invest more dollars in the Health category and fewer dollars in the Vices category, you can expect an uptrend in Health.

    There are Fixed or Non-Discretionary cost buckets like Home, Admin, Transport.
