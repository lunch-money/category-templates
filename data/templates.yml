# Lunch Money community category templates
#
# Each entry is one community-submitted category setup.
# The 'categories' block uses Lunch Money's import format:
#   - a leading "-" marks a subcategory of the line above it
#   - properties go in square brackets: income, exclude_from_budget, exclude_from_totals
#
# Entries are listed oldest first. Append new submissions to the end of this file.
# See CONTRIBUTING.md for the full schema and submission steps.

