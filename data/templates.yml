- id: broad-spending
  title: Broad Spending
  author: Kevin from Seattle
  description: >-
    Shopping collects every non-essential purchase, so one number shows what could be cut.
  in_their_words: |-
    We're fortunate enough to not have to budget strictly, but I am VERY particular about correctly categorizing each expense so we can easily track our spending to ensure it doesn't get out of control, and to prevent discretionary spending from ballooning. I tend to use the Shopping high-level category to include all purchased goods that we don't strictly need to survive, so if offers a very clear number at a glance of expenses that we can eliminate as a group if we need to save more.
