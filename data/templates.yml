- id: functional-view
  title: Functional View
  author: Cody from USA
  description: >-
    Sorted by how much control you have over a cost, rather than what was bought.
  in_their_words: |-
    We're a family with kids and I have a job that has irregular income. I like this setup because it helps me think about i) spend I can't change (periodic, recurring, etc.) ii)  how discretionary something is (e.g., a durable vs non-durable good - you'd spend more on a couch but that purchase is as infrequent vs items with a shorter shelf life) and iii) a separate category for Food as that is our highest "discretionary" cost, so I like a separate group to help measure our habits.
  tags:
    - Family with kids
  categories: |
    Income [income]
    - My Paycheck [income]
    - Spouse Paycheck [income]
    - My Bonus [income]
    - Other Income [income]
    Food
    - Coffee
    - Fast Food
    - Alcohol and Bars
    - Food Delivery
    - Groceries
    - Restaurants
    Nondurable Goods (items with shelf life of less than 2 years)
    - Home Supplies
    - Clothing
    - Child Clothes
    - Child Supplies
    - Child Toys
    - Books
    - Gifts
    Durable Goods (items with shelf life > 2 years)
    - Home Goods (couches, rugs, tables, chairs)
    - Home Decor (stuff from Target)
    - Electronics (laptops, phones, etc.)
    - Child Gear (strollers, high chairs, etc.)
    Periodic
    - Taxes
    - Property Tax
    - Home Maintenance (this can be argued as "variable" but I fix things periodically)
    - Home Insurance
    - Auto Insurance
    Recurring
    - Mortgage
    - Childcare
    - Subscriptions
    - Fitness
    - Electric
    - Gas
    - Internet
