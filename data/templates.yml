# Lunch Money community category templates
#
# Each entry is one community-submitted category setup.
# The 'categories' block uses Lunch Money's import format:
#   - a leading "-" marks a subcategory of the line above it
#   - properties go in square brackets: income, exclude_from_budget, exclude_from_totals
#
# Entries are listed oldest first. Append new submissions to the end of this file.
# See CONTRIBUTING.md for the full schema and submission steps.

- id: as-simple-as-possible-but-no-simpler
  title: As simple as possible but no simpler
  author: EG
  description: >-
    Broad categories for tracking where money goes, with detail only where it earns its place.
  in_their_words: |-
    Categories designed to track spending and income, not for detailed budgeting. Includes some specific categories to track particular areas of interest, and the rest are as general as possible to keep it simple.
  tags:
    - Solo / single
    - Salaried employee
    - Frequent traveler
    - Cross-border
