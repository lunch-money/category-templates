- id: digital-nomad-multi-biz-property-owner
  title: Digital Nomad Multi-biz & Property Owner
  author: Dylan from San Francisco
  description: >-
    Food and entertainment stay simple; daily transport, travel and rental income stay apart.
  in_their_words: |-
    Keep food simple, just eating out (restaurants) and eating in (groceries).

    Keep entertainment simple, just one category.

    I have transportation for daily life transport and travel transport separated. Since I'm a digital nomad sometimes living away from home for weeks at a time or more, I'll still use "daily life" uber transport when it feel like I'm using it for daily life reasons.

    I own rental properties that I keep excluded from totals so I can keep track of that business separately. Then I tag each rental property to keep track of them.

    I own a lifestyle website/blog business that doesn't make much money. Expenses aren't separated from totals like rental properties since they're low, but you could do that to keep your budget biz-free.
