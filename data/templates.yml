- id: just-millennial-things
  title: Just Millennial Things
  author: Harvest
  description: >-
    Pairs with rules and budgets to separate bills, necessities and quality-of-life spending.
  in_their_words: |-
    This is a simple but comprehensive system that works especially well with rules and the budget features so that all your categories and subcategories are neatly tracked every month. It has everything from grouping all your bills together, to being able to track how much you spend on daily necessities vs. quality of life purchases, as well as your future savings goals.
